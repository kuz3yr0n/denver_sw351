[metadata]
name = Denver_SW-351
version = 1.1
author = Mathias Lindström
description = Reverse engineered the notification-function for Denver SW-351 (to be used with Bleak and/or pyjnius on Androids)
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/kuz3yr0n/denver_sw351
license = LICENSE
classifiers =
    Intended Audience :: Developers
    Topic :: Software Development :: Build Tools
    Programming Language :: Python :: 3

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.13

[options.packages.find]
where = src
