[build-system]
requires = ['setuptools>=61.0.0', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'denver_sw351'
version = '1.4'
description = 'Reverse-engineered the notification-function for Denver SW-351 (to be used with Bleak and/or pyjnius on Androids)'
readme = 'README.md'
requires-python = '>=3.13'
license = 'MIT'
license-files = ['LICENSE']
authors = [
    { name = 'kuzeyron/kuz3yr0n and other contributors', email = 'globalkuzeyron@gmail.com' },
]
dependencies = ['bleak; sys_platform != "Android"']
classifiers = [
    'Intended Audience :: Developers',
    'Topic :: Software Development :: Build Tools',
    'Programming Language :: Python :: 3'
]

[project.urls]
Source = 'https://github.com/kuz3yr0n/denver_sw351'
'Bug Reports' = 'https://github.com/kuz3yr0n/denver_sw351/issues'

[tool.setuptools.packages.find]
where = ['src']

[tool.ruff]
exclude = [
    '__pycache__',
    '.tox',
    '.git/',
    'doc/',
    'build/',
    '.eggs/',
    'venv/',
]
lint.extend-ignore = [
    'E402',
    'E722',
    'E731',
    'E741',
    'F401',
    'F841',
]
lint.select = [
    'E',
    'F',
    'W',
]
